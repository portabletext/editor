name: Android IME

# Types on real Gboard in an Android emulator into a test page built from
# the workspace editor, see `packages/editor/android/README.md`.
#
# Each job runs its row's device test file through thumbjar's Android
# action, on a fresh emulator prepared for the row's language. The action
# retries once on a fresh emulator when the first never booted, adb lost it
# or Gboard's Japanese dictionary never loaded, see thumbjar's `docs/ci.md`.
#
# The `main` ruleset requires the `Android IME` job, so every pull request
# starts this workflow. The emulator jobs run only when `changes` matches a
# path in its filter. Otherwise `Android IME` passes without them.

on:
  pull_request:
    # `edited` covers base-branch retargets, which change the commit set
    # without firing `synchronize`.
    types: [opened, synchronize, reopened, edited]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: android-ime-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ github.event_name != 'pull_request' || (!(startsWith(github.head_ref, 'changeset-release/') && github.event.pull_request.head.repo.full_name == github.repository) && steps.filter.outputs.android == 'true') }}
    steps:
      # Version Packages pull requests, from `changeset-release/main` and `changeset-release/next`, only bump
      # versions and changelogs. Other pull requests that touch `packages/editor/package.json` still run.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request' && !(startsWith(github.head_ref, 'changeset-release/') && github.event.pull_request.head.repo.full_name == github.repository)
        with:
          filters: |
            android:
              - packages/editor/src/engine/react/components/editable.tsx
              - packages/editor/src/engine/react/hooks/android-input-manager/**
              - packages/editor/src/engine/react/hooks/use-track-user-input.ts
              - packages/editor/src/engine/dom/plugin/dom-editor.ts
              - packages/editor/src/behaviors/behavior.abstract.input.ts
              - packages/editor/src/editor/Editable.tsx
              - packages/editor/package.json
              - packages/editor/android/**
              - packages/editor/vitest.android.config.ts
              - .github/workflows/android-ime.yml

  emulator:
    name: Android IME (${{ matrix.suite.file }})
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    # Backstops only: `thumbjar run` bounds its own work and logs the reason when it stops the work, see
    # the time budget in `packages/editor/android/README.md`. The job's cap is the sum of every
    # step's cap, so a hang in every step still leaves time for the action's upload, and
    # `budget.test.ts` keeps it so.
    timeout-minutes: 285
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    strategy:
      fail-fast: false
      matrix:
        # One row per device test file CI runs, on a device prepared for its
        # language. `tests/en-textarea.test.ts` is a control run by hand.
        # `runMinutes` caps one run. `actionMinutes` caps the action, two runs
        # plus 10, see the step cap in thumbjar's `docs/ci.md`.
        suite:
          - {
              lang: ja,
              file: tests/ja.test.ts,
              runMinutes: 90,
              actionMinutes: 190,
            }
          - {
              lang: en,
              file: tests/en.test.ts,
              runMinutes: 90,
              actionMinutes: 190,
            }
          - {
              lang: ja,
              file: tests/ja.enter.test.ts,
              runMinutes: 90,
              actionMinutes: 190,
            }
          - {
              lang: en,
              file: tests/en.enter.test.ts,
              runMinutes: 90,
              actionMinutes: 190,
            }
          - {
              lang: en,
              file: tests/en.insert.break.test.ts,
              runMinutes: 124,
              actionMinutes: 258,
            }
          - {
              lang: en,
              file: tests/en.insert.text.test.ts,
              runMinutes: 90,
              actionMinutes: 190,
            }
        api: [36]

    steps:
      - name: Name the suite
        id: suite
        timeout-minutes: 1
        run: echo "name=$(basename '${{ matrix.suite.file }}' .test.ts)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        timeout-minutes: 3

      - uses: pnpm/action-setup@v6
        timeout-minutes: 2
      - uses: actions/setup-node@v6
        timeout-minutes: 3
        with:
          node-version: 24

      - name: Install project dependencies
        timeout-minutes: 8
        run: pnpm install

      - name: Build the test page
        timeout-minutes: 10
        run: |
          pnpm exec turbo build --filter='@portabletext/editor...'
          pnpm --filter @portabletext/editor build:android
          node -e "console.log('EDITOR_VERSION', require('./packages/editor/package.json').version)"

      # `thumbjar` resolves the test file against the page directory's parent, so the action runs in
      # `android/`, where `dist/` sits next to `tests/`.
      - name: Run on emulator
        timeout-minutes: ${{ matrix.suite.actionMinutes }}
        uses: portabletext/thumbjar/android@v1
        with:
          test: ${{ matrix.suite.file }}
          keyboard: ${{ matrix.suite.lang }}
          working-directory: packages/editor/android
          page-dir: dist
          config: ../vitest.android.config.ts
          project: device
          out-dir: out
          artifact-name: android-ime-${{ steps.suite.outputs.name }}-api${{ matrix.api }}-${{ github.run_attempt }}
          api-level: ${{ matrix.api }}

  result:
    name: Android IME
    needs: [changes, emulator]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      ANDROID_CHANGED: ${{ needs.changes.outputs.android }}
      EMULATOR_RESULT: ${{ needs.emulator.result }}
    steps:
      - name: Check the emulator jobs
        run: |
          echo "changes: $CHANGES_RESULT, android: $ANDROID_CHANGED, emulator: $EMULATOR_RESULT"
          test "$CHANGES_RESULT" = success
          if [ "$ANDROID_CHANGED" = true ]; then
            test "$EMULATOR_RESULT" = success
          else
            test "$ANDROID_CHANGED" = false
            test "$EMULATOR_RESULT" = skipped
          fi
