name: Checks

on:
  pull_request:
    # `edited` covers base-branch retargets, which change the commit set
    # without firing `synchronize`.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

jobs:
  checks:
    permissions:
      contents: read
      pull-requests: read
    uses: portabletext/.github/.github/workflows/checks.yml@1883b7424522d7be9fbdb2af2c6bdd0b729c6f60
    with:
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
