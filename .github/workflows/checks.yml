name: Checks

on:
  pull_request:
    # `edited` covers base-branch retargets, which change the commit set
    # without firing `synchronize`.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

jobs:
  checks:
    # Base changes alter the commit set that needs checking.
    if: github.event.action != 'edited' || github.event.changes.base
    permissions:
      contents: read
      pull-requests: read
    uses: portabletext/.github/.github/workflows/checks.yml@4cf8ce4545c55209143e2e1d23abaf781335568a
    with:
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
