name: Browser tests

on:
  # Build on pushes branches that have a PR (including drafts)
  pull_request:
    # `edited` covers base-branch retargets, which change the commit set
    # without firing `synchronize`.
    types: [opened, synchronize, reopened, edited]
  # Build on commits pushed to branches without a PR if it's in the allowlist
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each browser runs as three parts: the editor's suite split into two Vitest
# shards, and one job for every other package. The rulesets on `main` and
# `next` require the check names `Browser tests (<browser>)`, so one job per
# browser reports the combined result under that name and fails unless every
# part of that browser succeeded.
jobs:
  chromium-part:
    timeout-minutes: 60
    name: Browser tests (chromium, ${{ matrix.part.id }})
    runs-on: ubuntu-latest
    # The image ships every browser with its system libraries, so no job
    # installs browsers or apt packages. Its tag must match the resolved
    # `playwright` version, or the browser executables are missing and the
    # tests fail on launch. Renovate bumps the two together.
    container: &container
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      # Run as the runner's user, as Playwright's CI guide does.
      options: --user 1001
    env: &env
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
        part: &parts
          - id: editor-1
            turbo: --filter=@portabletext/editor
            vitest: --shard=1/2
          - id: editor-2
            turbo: --filter=@portabletext/editor
            vitest: --shard=2/2
          - id: others
            turbo: --filter=!@portabletext/editor

    steps: &steps
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install project dependencies
        run: pnpm install

      - name: Test
        id: test
        run: |
          node -v
          pnpm -v
          pnpm test:browser:${{ matrix.browser }} ${{ matrix.part.turbo }} --concurrency=2 -- --browser.trace=retain-on-failure ${{ matrix.part.vitest }}

      - name: racejar Playwright example
        if: matrix.browser == 'chromium' && matrix.part.id == 'others'
        run: pnpm --filter racejar test:playwright

      # Vitest writes each failed test's Playwright trace to a `__traces__`
      # folder next to its test file. Open one at https://trace.playwright.dev.
      - name: Upload Playwright traces
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: browser-traces-${{ matrix.browser }}-${{ matrix.part.id }}
          path: |
            packages/**/__traces__/
            !**/node_modules/**
          if-no-files-found: ignore
          retention-days: 7

  firefox-part:
    timeout-minutes: 60
    name: Browser tests (firefox, ${{ matrix.part.id }})
    runs-on: ubuntu-latest
    container: *container
    env: *env
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox]
        part: *parts
    steps: *steps

  webkit-part:
    timeout-minutes: 60
    name: Browser tests (webkit, ${{ matrix.part.id }})
    runs-on: ubuntu-latest
    container: *container
    env: *env
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit]
        part: *parts
    steps: *steps

  chromium:
    name: Browser tests (chromium)
    needs: chromium-part
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Chromium part to pass
        run: test "${{ needs.chromium-part.result }}" = success

  firefox:
    name: Browser tests (firefox)
    needs: firefox-part
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Firefox part to pass
        run: test "${{ needs.firefox-part.result }}" = success

  webkit:
    name: Browser tests (webkit)
    needs: webkit-part
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every WebKit part to pass
        run: test "${{ needs.webkit-part.result }}" = success
