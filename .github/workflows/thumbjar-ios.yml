# This workflow is not a required check.
name: thumbjar iOS

on:
  pull_request:
    paths:
      - packages/editor/src/engine/react/components/editable.tsx
      - packages/editor/src/engine/react/hooks/android-input-manager/**
      - packages/editor/src/engine/react/hooks/use-track-user-input.ts
      - packages/editor/src/engine/dom/plugin/dom-editor.ts
      - packages/editor/src/behaviors/behavior.abstract.input.ts
      - packages/editor/src/editor/Editable.tsx
      - packages/editor/package.json
      - packages/editor/android/**
      - .github/scripts/**
      - packages/editor/vitest.android.config.ts
      - packages/thumbjar/**
      - .github/workflows/android-ime.yml
      - packages/editor/vitest.ios.config.ts
      - .github/workflows/thumbjar-ios.yml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: thumbjar-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simulator:
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: macos-15
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        lang: [en, ja]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcrun simctl list runtimes available
      - run: pnpm install --frozen-lockfile
      - name: Build the existing Android page
        run: |
          pnpm exec turbo build --filter='@portabletext/editor...'
          pnpm --filter @portabletext/editor build:android
      - name: Install Appium and XCUITest
        run: |
          npm install --prefix "$RUNNER_TEMP/thumbjar-appium" appium@4.0.0
          "$RUNNER_TEMP/thumbjar-appium/node_modules/.bin/appium" driver install xcuitest@13.1.3
      - name: Set up the newest iOS runtime on an iPhone
        timeout-minutes: 30
        run: bash .github/scripts/thumbjar-ios-setup.sh ${{ matrix.lang }} packages/editor/android/out
      - name: Start Appium and page server
        working-directory: packages/editor
        run: |
          pnpm exec thumbjar serve android/dist --port 8765 > android/out/http.log 2>&1 &
          "$RUNNER_TEMP/thumbjar-appium/node_modules/.bin/appium" --keep-alive-timeout 1800 --log android/out/appium.log --log-level info > /dev/null 2>&1 &
          ready=false
          for attempt in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4723/status > /dev/null && curl -sfI http://localhost:8765/editor.html > /dev/null; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
      - name: Run language tests
        working-directory: packages/editor
        run: |
          pnpm exec vitest run --config vitest.ios.config.ts --project device tests/${{ matrix.lang }}.test.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: thumbjar-ios-${{ matrix.lang }}
          path: packages/editor/android/out/
