<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1760 1380" role="img" aria-labelledby="title desc">
<title id="title">How thumbjar drives Gboard and Chrome on an emulator</title>
<desc id="desc">A Vitest test calls runOnDevice. The driver uses adb to read Chrome over CDP and to reach uiautomator2, which finds and taps Gboard keys. thumbjar serve serves the page through adb reverse.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#606a74"/></marker></defs>
<style>text { font-family: system-ui, -apple-system, Segoe UI, sans-serif; fill: #292f35; } .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; } .muted { fill: #606a74; } .arrow { fill: none; stroke: #606a74; stroke-width: 3; marker-end: url(#arrow); }</style>

<rect x="0" y="0" width="1760" height="1380" rx="0" fill="white"/>
<rect x="24" y="30" width="770" height="1235" rx="26" fill="#f5f7f9" stroke="#d3dbe3" stroke-width="2"/>
<rect x="1180" y="30" width="556" height="1235" rx="55" fill="white" stroke="#292f35" stroke-width="6"/>
<text x="60" y="90" font-size="28" font-weight="650" xml:space="preserve">Your machine or CI runner</text>
<text x="1320" y="90" font-size="28" font-weight="650" xml:space="preserve">Android emulator</text>
<text x="1310" y="128" font-size="24" class="muted" xml:space="preserve">API 36, Play Store image</text>
<rect x="60" y="130" width="698" height="300" rx="18" fill="#f5fae7" stroke="#769b17" stroke-width="4"/>
<path d="M78 130 H740 Q758 130 758 148 V192 H60 V148 Q60 130 78 130" fill="#769b17"/>
<text x="86" y="172" font-size="28" font-weight="650" style="fill:white" xml:space="preserve">A Vitest test</text>
<text x="86" y="230" font-size="22" class="code" xml:space="preserve">const run = await runOnDevice(context, {</text>
<text x="86" y="263" font-size="22" class="code" xml:space="preserve">  url, keyboard: 'ja', prefix: '',</text>
<text x="86" y="296" font-size="22" class="code" xml:space="preserve">  steps: [{type: 'compose', letters: 'kyou',</text>
<text x="86" y="329" font-size="22" class="code" xml:space="preserve">           commit: {candidate: '今日'}}],</text>
<text x="86" y="362" font-size="22" class="code" xml:space="preserve">})</text>
<text x="86" y="395" font-size="22" class="code" xml:space="preserve">expect(run.text).toEqual('今日')</text>
<rect x="60" y="500" width="698" height="174" rx="18" fill="#fff8e0" stroke="#dfa90b" stroke-width="3"/>
<text x="86" y="546" font-size="28" font-weight="650" xml:space="preserve">runOnDevice(), the driver</text>
<text x="86" y="589" font-size="24" class="muted" xml:space="preserve">Taps each step's keys, reads the page</text>
<text x="86" y="623" font-size="24" class="muted" xml:space="preserve">after every step and returns a Run.</text>
<text x="86" y="657" font-size="24" class="muted" xml:space="preserve">Never retries an assertion.</text>
<rect x="60" y="752" width="698" height="182" rx="18" fill="#edf1f5" stroke="#606a74" stroke-width="3"/>
<text x="86" y="798" font-size="28" font-weight="650" xml:space="preserve">adb (Android Debug Bridge)</text>
<text x="86" y="841" font-size="24" class="muted" xml:space="preserve">Google's tool for controlling an Android device.</text>
<text x="86" y="875" font-size="24" class="muted" xml:space="preserve">Taps, shell commands, and port forwarding</text>
<text x="86" y="909" font-size="24" class="muted" xml:space="preserve">to the phone.</text>
<rect x="60" y="1080" width="698" height="130" rx="18" fill="#fff8e0" stroke="#dfa90b" stroke-width="3"/>
<text x="86" y="1130" font-size="28" font-weight="650" xml:space="preserve">thumbjar serve</text>
<text x="86" y="1175" font-size="24" class="muted" xml:space="preserve">Serves your built page</text>
<rect x="1205" y="170" width="506" height="390" rx="18" fill="#eaf2ff" stroke="#267bff" stroke-width="3"/>
<text x="1230" y="218" font-size="28" font-weight="650" xml:space="preserve">Chrome</text>
<text x="1555" y="218" font-size="24" class="code muted" xml:space="preserve">your page</text>
<rect x="1230" y="246" width="456" height="178" rx="12" fill="white" stroke="#c6d9fb" stroke-width="2"/>
<text x="1254" y="368" font-size="56" xml:space="preserve">今日</text>
<path d="M1377 316 V379" fill="none" stroke="#267bff" stroke-width="4"/>
<text x="1230" y="468" font-size="24" class="muted" xml:space="preserve">recordInput() logs every</text>
<text x="1230" y="502" font-size="24" class="muted" xml:space="preserve">composition, beforeinput</text>
<text x="1230" y="536" font-size="24" class="muted" xml:space="preserve">and input event</text>
<rect x="1205" y="650" width="506" height="342" rx="18" fill="#fff0ee" stroke="#f0352b" stroke-width="3"/>
<text x="1230" y="698" font-size="28" font-weight="650" xml:space="preserve">Gboard, the real keyboard</text>
<text x="1230" y="738" font-size="24" class="muted" xml:space="preserve">Composes きょう itself, offers 今日</text>
<rect x="1230" y="762" width="456" height="58" rx="10" fill="white" stroke="#ffb3ac" stroke-width="2"/>
<text x="1272" y="802" font-size="28" font-weight="650" xml:space="preserve">今日</text>
<text x="1437" y="802" font-size="28" xml:space="preserve">京</text>
<text x="1560" y="802" font-size="26" xml:space="preserve">きょう</text>
<path d="M1382 774 V808 M1534 774 V808" fill="none" stroke="#ffb3ac" stroke-width="2"/>
<rect x="1230" y="838" width="41" height="56" rx="7" fill="white" stroke="#f5a39c" stroke-width="1.5"/>
<text x="1242" y="875" font-size="24" xml:space="preserve">q</text>
<rect x="1276" y="838" width="41" height="56" rx="7" fill="white" stroke="#f5a39c" stroke-width="1.5"/>
<text x="1288" y="875" font-size="24" xml:space="preserve">w</text>
<rect x="1322" y="838" width="41" height="56" rx="7" fill="white" stroke="#f5a39c" stroke-width="1.5"/>
<text x="1334" y="875" font-size="24" xml:space="preserve">e</text>
<rect x="1368" y="838" width="41" height="56" rx="7" fill="white" stroke="#f5a39c" stroke-width="1.5"/>
<text x="1380" y="875" font-size="24" xml:space="preserve">r</text>
<rect x="1414" y="838" width="41" height="56" rx="7" fill="white" stroke="#f5a39c" stroke-width="1.5"/>
<text x="1426" y="875" font-size="24" xml:space="preserve">t</text>
<rect x="1460" y="838" width="41" height="56" rx="7" fill="#ffd8d2" stroke="#f0352b" stroke-width="3"/>
<text x="1472" y="875" font-size="24" font-weight="650" xml:space="preserve">y</text>
<rect x="1506" y="838" width="41" height="56" rx="7" fill="#ffd8d2" stroke="#f0352b" stroke-width="3"/>
<text x="1518" y="875" font-size="24" font-weight="650" xml:space="preserve">u</text>
<rect x="1552" y="838" width="41" height="56" rx="7" fill="white" stroke="#f5a39c" stroke-width="1.5"/>
<text x="1564" y="875" font-size="24" xml:space="preserve">i</text>
<rect x="1598" y="838" width="41" height="56" rx="7" fill="#ffd8d2" stroke="#f0352b" stroke-width="3"/>
<text x="1610" y="875" font-size="24" font-weight="650" xml:space="preserve">o</text>
<rect x="1644" y="838" width="41" height="56" rx="7" fill="white" stroke="#f5a39c" stroke-width="1.5"/>
<text x="1656" y="875" font-size="24" xml:space="preserve">p</text>
<rect x="1253" y="906" width="41" height="56" rx="7" fill="white" stroke="#f5a39c" stroke-width="1.5"/>
<text x="1265" y="943" font-size="24" xml:space="preserve">a</text>
<rect x="1299" y="906" width="41" height="56" rx="7" fill="white" stroke="#f5a39c" stroke-width="1.5"/>
<text x="1311" y="943" font-size="24" xml:space="preserve">s</text>
<rect x="1345" y="906" width="41" height="56" rx="7" fill="white" stroke="#f5a39c" stroke-width="1.5"/>
<text x="1357" y="943" font-size="24" xml:space="preserve">d</text>
<rect x="1391" y="906" width="41" height="56" rx="7" fill="white" stroke="#f5a39c" stroke-width="1.5"/>
<text x="1403" y="943" font-size="24" xml:space="preserve">f</text>
<rect x="1437" y="906" width="41" height="56" rx="7" fill="white" stroke="#f5a39c" stroke-width="1.5"/>
<text x="1449" y="943" font-size="24" xml:space="preserve">g</text>
<rect x="1483" y="906" width="41" height="56" rx="7" fill="white" stroke="#f5a39c" stroke-width="1.5"/>
<text x="1495" y="943" font-size="24" xml:space="preserve">h</text>
<rect x="1529" y="906" width="41" height="56" rx="7" fill="white" stroke="#f5a39c" stroke-width="1.5"/>
<text x="1541" y="943" font-size="24" xml:space="preserve">j</text>
<rect x="1575" y="906" width="41" height="56" rx="7" fill="#ffd8d2" stroke="#f0352b" stroke-width="3"/>
<text x="1587" y="943" font-size="24" font-weight="650" xml:space="preserve">k</text>
<rect x="1621" y="906" width="41" height="56" rx="7" fill="white" stroke="#f5a39c" stroke-width="1.5"/>
<text x="1633" y="943" font-size="24" xml:space="preserve">l</text>
<rect x="1205" y="1110" width="506" height="130" rx="18" fill="#fff8e0" stroke="#dfa90b" stroke-width="3"/>
<text x="1230" y="1153" font-size="28" font-weight="650" xml:space="preserve">uiautomator2</text>
<text x="1230" y="1190" font-size="24" class="muted" xml:space="preserve">Reads the screen to find where</text>
<text x="1230" y="1223" font-size="24" class="muted" xml:space="preserve">each key is, then taps it</text>
<path d="M409 430 V490" class="arrow"/>
<path d="M409 674 V742" class="arrow"/>
<path d="M758 820 H820 V360 H1244" class="arrow"/>
<text x="850" y="270" font-size="24" font-weight="650" xml:space="preserve">CDP over adb forward</text>
<text x="850" y="307" font-size="24" class="muted" xml:space="preserve">run JS, read text</text>
<text x="850" y="340" font-size="24" class="muted" xml:space="preserve">and every event</text>
<path d="M758 1145 H1140 V525 H1195" class="arrow"/>
<text x="850" y="596" font-size="24" font-weight="650" xml:space="preserve">adb reverse</text>
<text x="850" y="632" font-size="24" class="muted" xml:space="preserve">loads your page</text>
<path d="M758 890 H825 V1175 H1195" class="arrow"/>
<text x="853" y="1220" font-size="24" font-weight="650" xml:space="preserve">find each key, tap it</text>
<path d="M1660 1110 V1035 H1641 V974" class="arrow"/>
<text x="1275" y="1068" font-size="24" font-weight="650" xml:space="preserve">taps, like a finger</text>
<text x="528" y="1335" font-size="28" xml:space="preserve">A failing expect fails the test like any Vitest test.</text>
</svg>
